<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Page not found</title>
<style>html,body{margin:0;background:#fff}@media(prefers-color-scheme:dark){html,body{background:#0d1117}}</style>
</head><body>
<script>
/* 링크 형식: ?t=<기업키>-<토큰6자>
   토큰은 SHA-256 해시("<기업키>-<토큰>")로만 보관한다. 해시 생성: node tools/hash.mjs k a8f3k2 */
var COMPANIES = {
  b: { file: 'base', hash: '9b70908cd9cd8e2582318b6385ced47c3b553e74ca5abded6d409ba56814c462' }
  /* 기업 추가 예: k: { file: 'k', hash: '...', color: '#FFE812', role: '서비스기획' } */
};

function show(html){ document.open(); document.write(html); document.close(); }
function notFound(){
  fetch('404.html').then(function(r){return r.text();}).then(show)
    .catch(function(){ document.body.textContent = '404'; });
}
async function sha256(s){
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}
(async function(){
  try{
    var t = new URLSearchParams(location.search).get('t') || '';
    var m = /^([a-z0-9]{1,8})-([a-z0-9]{6})$/.exec(t);
    var c = m && Object.prototype.hasOwnProperty.call(COMPANIES, m[1]) ? COMPANIES[m[1]] : null;
    if(!c || (await sha256(t)) !== c.hash) return notFound();
    var html = await (await fetch('p/' + c.file + '.html')).text();
    html = html.replace('pdf/base.pdf', 'pdf/' + c.file + '.pdf');
    show(html);
  }catch(e){ notFound(); }
})();
</script>
</body></html>
